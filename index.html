<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Function Psi | Ψ Digital Lab</title>
  <meta name="description" content="One of the coolest websites out there — Function Psi's digital playground of tools, generators, and experiments." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-cool-mode="off">

  <!-- ============ DESKTOP ============ -->
  <div class="desktop" id="desktop">
    <div class="mesh-bg" id="mesh-bg"></div>
    <div class="scanlines" id="scanlines"></div>

    <!-- Start Menu -->
    <div class="start-menu" id="start-menu">
      <div class="start-header">
        <div class="start-avatar" id="start-avatar">FxΨ</div>
        <div class="start-info">
          <div class="start-name">Function Psi</div>
          <div class="start-title">Digital Lab & Portfolio</div>
        </div>
        <button class="start-close" id="start-close" aria-label="Close start menu">✕</button>
      </div>
      <div class="start-search">
        <span class="search-icon">🔍</span>
        <input type="text" id="start-search" placeholder="Search apps, tools, projects…" aria-label="Search apps" />
      </div>
      <div class="start-apps" id="start-apps"></div>
      <div class="start-footer">
        <button class="start-btn" id="start-theme" title="Toggle theme">🌓 Theme</button>
        <button class="start-btn" id="start-social" title="Social links">🔗 Socials</button>
      </div>
    </div>

    <div class="start-backdrop" id="start-backdrop"></div>

    <!-- Window stack -->
    <div class="windows" id="windows"></div>

    <!-- Desktop icons -->
    <div class="desktop-icons" id="desktop-icons"></div>
  </div>

  <!-- Toast notification -->
  <div class="toast" id="toast"></div>

  <!-- ============ TASKBAR ============ -->
  <div class="taskbar" id="taskbar">
    <button class="taskbar-start" id="taskbar-start" aria-label="Open start menu">
      <span class="tb-logo" id="tb-logo">FxΨ</span>
    </button>

    <div class="taskbar-apps" id="taskbar-apps"></div>

    <div class="taskbar-spacer"></div>

    <div class="taskbar-system">
      <button class="sys-btn" id="sys-theme" title="Toggle dark/light theme">🌓</button>
      <button class="sys-btn" id="sys-social" title="Social links">🔗</button>
      <div class="sys-clock" id="sys-clock">--:--</div>
      <div class="sys-date" id="sys-date"></div>
    </div>
  </div>

  <!-- Social overlay -->
  <div class="overlay" id="overlay">
    <div class="overlay-card" id="social-card">
      <button class="overlay-close" id="overlay-close">✕</button>
      <h3>Connect with Function Psi</h3>
      <p>Follow across the web</p>
      <div class="social-group">
        <a href="https://x.com/fnpsi_" target="_blank" rel="noopener" class="social-link">
          <span class="s-icon">𝕏</span>
          <span class="s-label">X / Twitter</span>
          <span class="s-value">@fnpsi_</span>
        </a>
        <a href="https://instagram.com/fnpsi" target="_blank" rel="noopener" class="social-link">
          <span class="s-icon">📷</span>
          <span class="s-label">Instagram</span>
          <span class="s-value">fnpsi</span>
        </a>
        <a href="https://youtube.com/@fnpsi" target="_blank" rel="noopener" class="social-link">
          <span class="s-icon">▶️</span>
          <span class="s-label">YouTube</span>
          <span class="s-value">@fnpsi</span>
        </a>
      </div>
      <div class="divider"></div>
      <p class="note">Built & owned by Function Psi (FxΨ)</p>
    </div>
  </div>

  <!-- Data -->
  <script src="data/tools.json"></script>
  <script src="data/portfolio.js"></script>
  <!-- App logic -->
  <script src="js/core.js"></script>
  <script src="js/apps.js"></script>
  <script src="js/generator.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const wm = new WindowManager();
      window.wmInstance = wm;
      wm.boot();
    });
  </script>
</body>
</html>
