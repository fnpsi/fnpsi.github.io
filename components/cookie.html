<section class="cookie" data-cookie-banner hidden aria-label="Cookie and storage preferences" aria-describedby="cookie-copy">
  <div class="cookie__inner">
    <div>
      <p class="eyebrow">Your call</p>
      <h2>Cookies, but the polite kind.</h2>
      <p id="cookie-copy">
        This site does not use advertising cookies or third-party analytics. It stores your choice here.
        If you accept, it can also remember the last three projects you viewed. Essential only stores this
        preference and nothing else. <a href="/privacy.html#cookies">Read the cookie section</a>.
      </p>
      <p class="mono" data-consent-current style="margin-top:.65rem;color:var(--quiet);font-size:.56rem;"></p>
    </div>
    <div class="cookie__actions">
      <button class="btn" type="button" data-consent="accepted"><span>Accept all</span></button>
      <button class="btn btn--ghost" type="button" data-consent="essential"><span>Essential only</span></button>
    </div>
  </div>
</section>
