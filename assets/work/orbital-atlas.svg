<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
  <title id="title">Orbital Atlas</title>
  <desc id="desc">A cyan and blue orbital data visualisation with a central planet, orbital paths and points of light.</desc>
  <defs>
    <radialGradient id="space" cx="50%" cy="46%" r="75%">
      <stop offset="0" stop-color="#102d3a"/>
      <stop offset=".46" stop-color="#07141d"/>
      <stop offset="1" stop-color="#04080d"/>
    </radialGradient>
    <radialGradient id="planet" cx="38%" cy="32%" r="70%">
      <stop offset="0" stop-color="#bdf5ff"/>
      <stop offset=".25" stop-color="#35cbe5"/>
      <stop offset=".7" stop-color="#0b627c"/>
      <stop offset="1" stop-color="#031923"/>
    </radialGradient>
    <radialGradient id="haze" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7ee7ff" stop-opacity=".32"/>
      <stop offset="1" stop-color="#7ee7ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="microgrid" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M100 0H0V100" fill="none" stroke="#7ee7ff" stroke-opacity=".055"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>

  <rect width="1600" height="1200" fill="url(#space)"/>
  <rect width="1600" height="1200" fill="url(#microgrid)"/>
  <ellipse cx="800" cy="560" rx="560" ry="470" fill="url(#haze)" filter="url(#blur)"/>

  <g fill="none" stroke="#7ee7ff">
    <ellipse cx="800" cy="560" rx="525" ry="170" transform="rotate(-15 800 560)" stroke-opacity=".38"/>
    <ellipse cx="800" cy="560" rx="430" ry="330" transform="rotate(28 800 560)" stroke-opacity=".22" stroke-dasharray="3 12"/>
    <ellipse cx="800" cy="560" rx="630" ry="270" transform="rotate(9 800 560)" stroke-opacity=".16"/>
    <ellipse cx="800" cy="560" rx="290" ry="410" transform="rotate(-40 800 560)" stroke-opacity=".12" stroke-dasharray="2 16"/>
  </g>

  <circle cx="800" cy="560" r="152" fill="url(#planet)"/>
  <circle cx="800" cy="560" r="152" fill="none" stroke="#bdf5ff" stroke-opacity=".55"/>
  <ellipse cx="800" cy="560" rx="262" ry="66" fill="none" stroke="#bdf5ff" stroke-opacity=".52" transform="rotate(-13 800 560)"/>
  <ellipse cx="800" cy="560" rx="262" ry="66" fill="none" stroke="#7ee7ff" stroke-opacity=".15" transform="rotate(-13 800 560)" stroke-width="16"/>

  <g fill="#bdf5ff">
    <circle cx="394" cy="441" r="4"/><circle cx="1210" cy="478" r="3"/><circle cx="1066" cy="266" r="5"/>
    <circle cx="518" cy="776" r="3"/><circle cx="1302" cy="738" r="4"/><circle cx="932" cy="887" r="3"/>
    <circle cx="300" cy="617" r="2"/><circle cx="1130" cy="916" r="2"/><circle cx="690" cy="205" r="2"/>
    <circle cx="1410" cy="580" r="3" fill="#7ee7ff"/><circle cx="210" cy="305" r="2" fill="#7ee7ff"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" fill="#cceff6">
    <text x="94" y="115" font-size="22" letter-spacing="6" fill="#7ee7ff">FNPSI / 003</text>
    <text x="1506" y="115" text-anchor="end" font-size="22" letter-spacing="6" fill="#7ee7ff">WEB3D / 2025</text>
    <text x="94" y="1065" font-size="102" letter-spacing="-5">ORBITAL ATLAS</text>
    <text x="96" y="1114" font-size="22" letter-spacing="4" fill="#7b9aa5">NEAR-EARTH OBJECTS / 1,248 INSTANCES / LIVE TIME SCRUB</text>
    <text x="1506" y="1100" text-anchor="end" font-size="20" letter-spacing="4" fill="#7ee7ff">ALT 408 KM</text>
  </g>

  <g stroke="#7ee7ff" stroke-opacity=".35">
    <path d="M110 180V240M80 210H140"/>
    <path d="M1460 930V990M1430 960H1490"/>
  </g>
</svg>
