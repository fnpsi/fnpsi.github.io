<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
  <title id="title">Field Notes</title>
  <desc id="desc">An editorial collage in warm paper, black serif type and vermilion details.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf7ef"/>
      <stop offset=".6" stop-color="#eee7d9"/>
      <stop offset="1" stop-color="#e4dac9"/>
    </linearGradient>
    <linearGradient id="photo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b7b0a2"/>
      <stop offset=".45" stop-color="#615e56"/>
      <stop offset="1" stop-color="#242522"/>
    </linearGradient>
    <pattern id="columns" width="110" height="1200" patternUnits="userSpaceOnUse">
      <path d="M0 0V1200" stroke="#0a0a0a" stroke-opacity=".055"/>
    </pattern>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .07"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="1600" height="1200" fill="url(#paper)"/>
  <rect width="1600" height="1200" fill="url(#columns)"/>

  <rect x="106" y="185" width="626" height="520" fill="url(#photo)"/>
  <g opacity=".4">
    <circle cx="410" cy="360" r="150" fill="#eee7d9"/>
    <path d="M106 520L360 400L520 555L732 480V705H106Z" fill="#151614"/>
  </g>
  <text x="128" y="666" font-family="Arial, Helvetica, sans-serif" font-size="17" letter-spacing="4" fill="#f3f1ea">PLATE 01 / THE COAST AT 06:14</text>

  <rect x="774" y="186" width="310" height="392" fill="#ff4f2f"/>
  <text x="806" y="238" font-family="Arial, Helvetica, sans-serif" font-size="17" letter-spacing="4" fill="#0a0a0a">FIELD NOTE 04</text>
  <text x="806" y="500" font-family="Georgia, serif" font-style="italic" font-size="52" fill="#0a0a0a">the edge of</text>
  <text x="806" y="550" font-family="Georgia, serif" font-style="italic" font-size="52" fill="#0a0a0a">the known</text>

  <rect x="1116" y="186" width="378" height="520" fill="#0a0a0a"/>
  <text x="1148" y="238" font-family="Arial, Helvetica, sans-serif" font-size="17" letter-spacing="4" fill="#f3f1ea">INDEX / 001—048</text>
  <g font-family="Georgia, serif" font-size="25" fill="#f3f1ea">
    <text x="1148" y="310">01. Salt light</text>
    <text x="1148" y="362">02. Low tide</text>
    <text x="1148" y="414">03. Stone memory</text>
    <text x="1148" y="466">04. The long way</text>
    <text x="1148" y="518">05. After rain</text>
    <text x="1148" y="570">06. A quieter city</text>
    <text x="1148" y="622">07. Northbound</text>
  </g>

  <g fill="#0a0a0a" font-family="Arial, Helvetica, sans-serif">
    <text x="94" y="115" font-size="22" letter-spacing="6">FNPSI / 005</text>
    <text x="1506" y="115" text-anchor="end" font-size="22" letter-spacing="6" fill="#ff4f2f">WEB / 2024</text>
    <text x="94" y="960" font-family="Georgia, serif" font-style="italic" font-size="230" letter-spacing="-10">Field Notes</text>
    <text x="96" y="1052" font-size="22" letter-spacing="4" fill="#6f675b">A READING ROOM FOR WRITERS, PHOTOGRAPHERS AND RESEARCHERS</text>
    <line x1="94" y1="1082" x2="1506" y2="1082" stroke="#0a0a0a" stroke-opacity=".22"/>
    <text x="96" y="1128" font-size="19" letter-spacing="4" fill="#6f675b">ISSUE 04 / 2024</text>
    <text x="1506" y="1128" text-anchor="end" font-size="19" letter-spacing="4" fill="#ff4f2f">READ SLOWLY</text>
  </g>

  <rect width="1600" height="1200" filter="url(#grain)" opacity=".6"/>
</svg>
