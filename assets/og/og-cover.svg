<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Function Psi — Rendani Manugeni</title>
  <desc id="desc">A dark social preview with the line Making digital stuff is so cool.</desc>
  <defs>
    <radialGradient id="bg" cx="76%" cy="20%" r="80%">
      <stop offset="0" stop-color="#1b1728"/>
      <stop offset=".4" stop-color="#0d0e11"/>
      <stop offset="1" stop-color="#07080a"/>
    </radialGradient>
    <radialGradient id="orb" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".12" stop-color="#c9ff4a"/>
      <stop offset=".4" stop-color="#81838c"/>
      <stop offset=".72" stop-color="#22242b"/>
      <stop offset="1" stop-color="#08090a"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#9b7bff" stop-opacity=".38"/>
      <stop offset="1" stop-color="#9b7bff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#f3f1ea" stroke-opacity=".045"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="26"/></filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <ellipse cx="1010" cy="290" rx="300" ry="290" fill="url(#glow)" filter="url(#blur)"/>
  <circle cx="1000" cy="300" r="186" fill="url(#orb)"/>
  <ellipse cx="1000" cy="300" rx="256" ry="78" fill="none" stroke="#c9ff4a" stroke-opacity=".45" transform="rotate(-18 1000 300)"/>
  <ellipse cx="1000" cy="300" rx="292" ry="104" fill="none" stroke="#9b7bff" stroke-opacity=".3" transform="rotate(16 1000 300)"/>

  <g font-family="Arial, Helvetica, sans-serif" fill="#f3f1ea">
    <text x="64" y="78" font-size="17" letter-spacing="5" fill="#a2a2a9">FUNCTION PSI / RENDANI MANUGENI</text>
    <text x="1136" y="78" text-anchor="end" font-size="17" letter-spacing="5" fill="#c9ff4a">FNPSI.ENV.PM</text>

    <text x="64" y="272" font-size="86" letter-spacing="-5">Making digital</text>
    <text x="64" y="356" font-size="86" letter-spacing="-5">stuff is</text>
    <text x="348" y="440" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="106" fill="#c9ff4a" letter-spacing="-3">so cool.</text>

    <line x1="64" y1="520" x2="1136" y2="520" stroke="#f3f1ea" stroke-opacity=".18"/>
    <text x="64" y="568" font-size="17" letter-spacing="4" fill="#a2a2a9">3D / WEB3D / WEB</text>
    <text x="1136" y="568" text-anchor="end" font-size="17" letter-spacing="4" fill="#a2a2a9">ONE OF THE COOLEST WEBSITES OUT THERE.</text>
  </g>
</svg>
